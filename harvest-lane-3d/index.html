<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- The game is a bright daytime farm; opt out of browser forced-dark so a phone dark theme cannot lay a dark filter over it. -->
    <meta name="color-scheme" content="light only" />
    <title>Harvest Lane 3D</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌽</text></svg>" />
    <!-- YouTube Playables SDK. The integration requirements say the
         SDK must load before any game code, so it sits in the head,
         ahead of every other script. Outside the Playables
         environment the game ignores it and runs standalone; the
         adapter in src/platform guards every call. -->
    <script src="https://www.youtube.com/game_api/v1"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
